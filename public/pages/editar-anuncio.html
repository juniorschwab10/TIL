<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <title>Editar anúncio | The Iron Legacy</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <a class="logo" href="/">THE IRON <span>LEGACY</span></a>
      <nav>
        <a href="/anuncios.html">Peças</a>
        <a href="/garagem">Garagem</a>
        <a href="/perfil.html">Perfil</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <a class="back" href="/meus-anuncios">&larr; Voltar para meus anúncios</a>

    <div class="heading">
      <p class="eyebrow">EDITAR PEÇA</p>
      <h1>Editar anúncio</h1>
      <p class="muted">Altere as informações ou as fotos da sua peça.</p>
    </div>

    <form class="publish" id="form-editar-anuncio">
    <section class="panel" id="painel-formulario">
        <h2>Informações da peça</h2>
        <p class="muted" id="carregando-aviso">Carregando dados do anúncio...</p>

        <div class="grid">
            <div class="input-container">
                <label>Nome da peça</label>
                <input name="nome" id="campo-nome" placeholder="Ex.: Carburador Weber 40" required/>
            </div>

            <div class="input-container">
                <label>Categoria</label>
                <select name="categoria" id="campo-categoria">
                    <option value="">Selecione</option>
                    <option value="Motor">Motor</option>
                    <option value="Carroceria">Carroceria</option>
                    <option value="Eletrica">Elétrica</option>
                </select>
            </div>
        </div>

        <div class="input-container">
            <label>Fotos da peça (até 3 no total)</label>

            <!-- Fotos que já existem no anúncio — cada uma com um "✕" pra remover -->
            <div id="fotos-existentes-wrapper" class="previa-imagens" hidden></div>

            <small class="muted" id="aviso-limite-fotos"></small>

            <!--
              name="novasImagens" (plural) tem que bater com o
              upload.array("novasImagens", 3) do server.js.
            -->
            <input type="file" name="novasImagens" accept="image/*" id="input-novas-imagens" multiple/>

            <!-- Prévia das NOVAS fotos escolhidas (ainda não salvas) -->
            <div id="previa-novas-imagens-wrapper" class="previa-imagens" hidden></div>
        </div>

        <!--
          Marca/modelo/ano são do VEÍCULO com o qual a peça é compatível —
          é isso que alimenta os filtros de busca do catálogo. Se a peça
          servir em qualquer veículo, deixe em branco.
        -->
        <div class="grid">
            <div class="input-container">
                <label>Marca compatível</label>
                <input name="marca" id="campo-marca" placeholder="Ex.: Chevrolet"/>
            </div>

            <div class="input-container">
                <label>Modelo compatível</label>
                <input name="modelo" id="campo-modelo" placeholder="Ex.: Opala"/>
            </div>
        </div>

        <div class="grid">
            <div class="input-container">
                <label>Ano inicial</label>
                <input name="ano_inicial" id="campo-ano-inicial" type="number" placeholder="Ex.: 1975"/>
            </div>

            <div class="input-container">
                <label>Ano final</label>
                <input name="ano_final" id="campo-ano-final" type="number" placeholder="Opcional"/>
            </div>
        </div>

        <div class="input-container">
            <label>Localização</label>
            <input name="localizacao" id="campo-localizacao" placeholder="Ex.: Foz do Iguaçu, PR"/>
        </div>

        <div class="input-container">
            <label>Descrição</label>
            <textarea name="descricao" id="campo-descricao" placeholder="Descreva a peça..." rows="7"></textarea>
        </div>

        <div class="grid">
            <div class="input-container">
                <label>Condição</label>
                <select name="condicao" id="campo-condicao">
                    <option value="Usada">Usada</option>
                    <option value="Nova">Nova</option>
                </select>
            </div>

            <div class="input-container">
                <label>Preço</label>
                <input name="preco" id="campo-preco" placeholder="0,00" type="number" step="0.01" required/>
            </div>
        </div>

        <button class="button primary" type="submit">Salvar alterações</button>
    </section>
    </form>
  </main>

  <script src="/js/compartilhado/widgets.js"></script>

    
    <script src="/js/paginas/editar-anuncio.js"></script>

    <!-- 3. Script do Painel de Acessibilidade -->
    <script src="/js/compartilhado/acessibilidade.js"></script>
    <script src="/js/compartilhado/contato.js"></script>
    <script src="/js/compartilhado/rodape.js"></script>
</body>
</html>
