<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil | The Iron Legacy</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
    <header class="header">
        <div class="wrap flex-between">
            <a class="logo" href="/">THE IRON <span>LEGACY</span></a>
            <nav class="nav">
                <a href="/anuncios.html">Peças</a>
                <a href="/garagem">Garagem</a>
                <a href="/logout">Sair</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <section class="profilehead">
            <div class="avatar big" id="avatar-perfil">--</div>
            <div>
                <p class="eyebrow">MINHA CONTA</p>
                <h1 id="nome-perfil">Carregando...</h1>
                <p class="muted">Membro desde 2026 · Paraná, Brasil</p>
            </div>
        </section>

        <div class="profilegrid">
            <section class="panel">
                <h2>Dados pessoais</h2>
                <form id="form-perfil">
                    <div class="input-container">
                        <label>Nome completo</label>
                        <input id="input-nome" type="text" required />
                    </div>
                    <br>
                    <div class="input-container">
                        <label>E-mail</label>
                        <input id="input-email" type="email" required />
                    </div>
                    <br>
                    <div class="input-container">
                        <label>Telefone</label>
                        <input id="input-telefone" type="text" required />
                    </div>
                    <br>
                    <button type="submit" class="button primary">Salvar alterações</button>
                </form>
            </section>

            <section class="panel stats">
                <h2>Minha atividade</h2>
                <div>
                    <b id="stat-veiculos">--</b>
                    <span>Veículos</span>
                </div>
                <div>
                    <b id="stat-anuncios">--</b>
                    <span>Anúncios</span>
                </div>

                <!-- Leva pra tela onde o usuário edita/exclui os próprios anúncios -->
                <a href="/meus-anuncios" class="button secondary full-width botao-bloco botao-bloco--primeiro">
                    Ver meus anúncios
                </a>

                <!-- Leva pra lista de peças em que o usuário clicou "Tenho interesse" -->
                <a href="/meus-interesses" class="button secondary full-width botao-bloco">
                    Meus interesses
                </a>
            </section>
        </div>
    </main>

    <script src="/js/compartilhado/widgets.js"></script>

    
    <script src="/js/paginas/perfil.js"></script>
    <script src="/js/compartilhado/acessibilidade.js"></script>
    <script src="/js/compartilhado/contato.js"></script>
    <script src="/js/compartilhado/rodape.js"></script>
</body>
</html>
